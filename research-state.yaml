      value: 1.0
      runs: 14
    - experiment: H3_bc_rnn_closed_loop
      value: 0.0
      runs: 5
    - experiment: H4_diffusion_closed_loop
      value: 0.4
      runs: 5
    - experiment: H7_pure_actuator_transport
      value: 0.0
      runs: 1

outer_loop:
  cycle: 4
  last_direction: "Pause model scaling, reconcile physical-transport evidence, and test only a genuinely new supported contact topology."
  last_reflection: "The latest probe repeated an archived wheel-controller limitation because that boundary was absent from the active state index. Direct base-qpos contact transport must no longer be reported as complete pure dynamics."

