project:
  title: "JCIIOT 2026 robust hybrid mobile manipulation"
  question: "Can a verified hybrid controller retain full public score while generalizing to explicit pose and dynamics perturbations without private simulator-state shortcuts?"
  status: active
  started: "2026-07-28"
  domain: "robot imitation learning and mobile manipulation"

competition:
  official_commit: "0dcdddf18a9e694569aa1433cdfc04eb097fed78"
  public_score_total: 100
  scoring_priority:
    - task_score
    - zero_collision
    - held_out_success
    - elapsed_time
    - innovation
  claim_boundary: "Public fixed-scene local scorer only; no BienData or organizer-verified score."

literature:
  key_papers:
    - id: robomimic-v05
      title: "robomimic v0.5"
      authors: "ARISE Initiative"
      year: 2026
      relevance: "Bundled implementation provides BC-RNN, BC-Transformer, action normalization, future action prediction, and UNet Diffusion Policy."
    - id: mimicgen
      title: "MimicGen: A Data Generation System for Scalable Robot Learning using Human Demonstrations"
      authors: "Mandlekar et al."
      year: 2023
      relevance: "Object-relative subtask transformation is applicable to generating perturbed JCIIOT teacher trajectories."
    - id: diffusion-policy
      title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
      authors: "Chi et al."
      year: 2023
      relevance: "Candidate only if simple BC exhibits persistent multimodal correction failures."
    - id: act
      title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware"
      authors: "Zhao et al."
      year: 2023
      relevance: "Action chunking is a candidate only if compounding error is measured after the BC data interface is proven."
  open_problems:
    - "Reliable bimanual grasp under small object and base pose shifts."
    - "Physical multi-object placement without direct qpos or attachment-state mutation."
    - "Separating task-policy error from data and action-interface error."
  evidence_gaps:
    - "No learned policy has passed unseen closed-loop bilateral grasp and lift."
    - "No recovery demonstrations cover single-arm contact or approach drift."
    - "No learned local grasp policy has passed a full five-level regression."

hypotheses:
  - id: H1
    statement: "Explicit object and base pose perturbations will reveal failures hidden by deterministic multi-seed resets."
    status: confirmed
    motivation: "The previous 80-run batch had identical trajectory lengths and final geometry."
    parent: null
    priority: high
  - id: H2
    statement: "Competition-native object-relative teacher segments remain collectable under registered pose perturbations."
    status: confirmed
    motivation: "MimicGen-style transformation preserves task geometry while varying initial state."
    parent: null
    priority: high
  - id: H3
    statement: "Low-dimensional BC-RNN trained on the validated Tiago interface will reproduce bilateral grasp and lift on unseen small perturbations."
    status: rejected
    motivation: "Offline held-out MSE improved by 92.76%, but closed-loop success was 0/5 due to single-arm contact collapse."
    parent: null
    priority: high
  - id: H4
    statement: "Same-data Diffusion Policy action sequences will reduce compounding contact-mode error relative to BC-RNN."
    status: active
    motivation: "The validated BC-RNN interface passed offline but failed all closed-loop grasps, activating the pre-registered challenger."
    parent: null
    priority: medium

experiments:
  proxy_metric: "Held-out full-score rate subject to zero scored collisions."
  baseline_value: 0.0
  best_value: 0.0
  total_runs: 19
  active_protocol: "experiments/h4-diffusion-policy/protocol.md"
  next_experiment: "Train bundled low-dimensional Diffusion Policy on the frozen H3 split, then evaluate new seeds without tuning on H3 closed-loop failures."
  trajectory:
    - experiment: H2_teacher_collection
      value: 1.0
      runs: 14
    - experiment: H3_bc_rnn_closed_loop
      value: 0.0
      runs: 5

outer_loop:
  cycle: 2
  last_direction: "Escalate from deterministic BC-RNN to same-data action-sequence diffusion, while retaining the deterministic teacher as the scored incumbent."
  last_reflection: "BC-RNN's low held-out MSE concealed single-arm contact collapse in 5/5 closed-loop runs; model selection must remain rollout-gated."

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "experiments/"
  to_human_dir: "to_human/"
  paper_dir: "paper/"
  large_artifacts: "/Users/wangpeng/jciiot-2026-assets and remote experiment directories"
