project:
  title: "JCIIOT 2026 robust hybrid mobile manipulation"
  question: "Can a verified hybrid controller retain full public score while generalizing to explicit pose and dynamics perturbations without private simulator-state shortcuts?"
  status: active
  started: "2026-07-28"
  domain: "robot imitation learning and mobile manipulation"

competition:
  official_commit: "0dcdddf18a9e694569aa1433cdfc04eb097fed78"
  public_score_total: 100
  scoring_priority:
    - task_score
    - zero_collision
    - held_out_success
    - elapsed_time
    - innovation
  claim_boundary: "Public fixed-scene local scorer only; no BienData or organizer-verified score."

literature:
  key_papers:
    - id: robomimic-v05
      title: "robomimic v0.5"
      authors: "ARISE Initiative"
      year: 2026
      relevance: "Bundled implementation provides BC-RNN, BC-Transformer, action normalization, future action prediction, and UNet Diffusion Policy."
    - id: mimicgen
      title: "MimicGen: A Data Generation System for Scalable Robot Learning using Human Demonstrations"
      authors: "Mandlekar et al."
      year: 2023
      relevance: "Object-relative subtask transformation is applicable to generating perturbed JCIIOT teacher trajectories."
    - id: diffusion-policy
      title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
      authors: "Chi et al."
      year: 2023
      relevance: "Candidate only if simple BC exhibits persistent multimodal correction failures."
    - id: act
      title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware"
      authors: "Zhao et al."
      year: 2023
      relevance: "Action chunking is a candidate only if compounding error is measured after the BC data interface is proven."
  open_problems:
    - "Reliable bimanual grasp under small object and base pose shifts."
    - "Physical multi-object placement without direct qpos or attachment-state mutation."
    - "Separating task-policy error from data and action-interface error."
  evidence_gaps:
    - "No learned policy has passed unseen closed-loop bilateral grasp and lift."
    - "No recovery demonstrations cover single-arm contact or approach drift."
    - "No learned local grasp policy has passed a full five-level regression."

hypotheses:
  - id: H1
    statement: "Explicit object and base pose perturbations will reveal failures hidden by deterministic multi-seed resets."
    status: confirmed
    motivation: "The previous 80-run batch had identical trajectory lengths and final geometry."
    parent: null
    priority: high
  - id: H2
    statement: "Competition-native object-relative teacher segments remain collectable under registered pose perturbations."
    status: confirmed
    motivation: "MimicGen-style transformation preserves task geometry while varying initial state."
    parent: null
    priority: high
  - id: H3
    statement: "Low-dimensional BC-RNN trained on the validated Tiago interface will reproduce bilateral grasp and lift on unseen small perturbations."
    status: rejected
    motivation: "Offline held-out MSE improved by 92.76%, but closed-loop success was 0/5 due to single-arm contact collapse."
    parent: null
    priority: high
  - id: H4
    statement: "Same-data Diffusion Policy action sequences will reduce compounding contact-mode error relative to BC-RNN."
    status: rejected
    motivation: "The validation-selected policy passed its offline gate but achieved only 2/5 unseen closed-loop grasp-and-lift successes, below the locked 4/5 promotion threshold."
    parent: null
    priority: medium
  - id: H5
    statement: "Teacher-labeled approach-drift and asymmetric-contact recovery trajectories will raise the unchanged H4 Diffusion Policy to at least 8/10 unseen L1 grasp-and-lift successes."
    status: paused
    motivation: "H4's three failures isolate missing learner-state coverage: two bilateral contacts without lift and one approach that never made contact."
    parent: H4
    priority: high
  - id: H6
    statement: "Recovery-augmented H2 plus H5b data will produce a deployable Diffusion grasp policy without a complete physical-transport teacher."
    status: rejected
    motivation: "The 36-trajectory epoch-140 model only passed offline MSE; severe action clipping remained and no valid transport rollout existed, so further same-data training was stopped."
    parent: H5
    priority: high
  - id: H7
    statement: "The locked Tiago composite wheel action can provide enough base motion for a complete pure-dynamics L1 carry."
    status: rejected
    motivation: "The corrected 635-step run moved the base only 0.002161 m; the archived full-scale controller test had already measured only about 5.6 mm in 100 actions."
    parent: null
    priority: high
  - id: H8
    statement: "A supported physical push or drag can satisfy L1 scoring without object attachment or object-pose writes, with any simulator-level navigation abstraction explicitly separated from pure dynamics."
    status: confirmed
    motivation: "Archived iter33 and iter34 physically pushed L1 to 0.748201 m from target with zero collision, attachment, or object-pose writes; the unmodified official scorer returned 10/10 for both."
    parent: H7
    priority: high
  - id: H9
    statement: "The frozen H8 floor-push route can be integrated into the allowed official RobotAgent entrypoint without losing L1 score or integrity."
    status: active
    motivation: "H8 was produced by a research runner; submission readiness requires the same route through skills/workflows selected by app.py."
    parent: H8
    priority: high

